background {
    monitor =
    path = ~/Pictures/Wallpapers/wp11027822-ralph-mcquarrie-wallpapers.jpg
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 1
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(cc0000ee) rgba(ff6600ee) 45deg
    check_color=rgba(cc0000ee) rgba(ff6600ee) 270deg
    fail_color=rgba(cc0000ee) rgba(cc0000ee) 40deg

    placeholder_text = <i>Input password...</i>

    font_family = CommitMonoNerdFont
    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    position = 0, -45
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgba(242, 232, 227, 0.8)
    font_size = 40
    font_family = CommitMonoNerdFont

    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%B %d, %Y")"
    color = rgba(242, 232, 227, 0.8)
    font_size = 15
    font_family = CommitMonoNerdFont

    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = Hi, $USER
    color = rgba(ff7f00ee)
    font_size = 20
    font_family = CommitMonoNerdFont

    position = 0, 30
    halign = center
    valign = center
}
